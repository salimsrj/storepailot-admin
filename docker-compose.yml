services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-pailot-ai-admin-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_URL: ${APP_URL:-http://storepailotadmin.test}
      DB_CONNECTION: mysql
      DB_HOST: store-pailot-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-store_pailot_ai_admin}
      DB_USERNAME: ${DB_USERNAME:-store}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
    extra_hosts:
      - "storepailot.test:host-gateway"
    depends_on:
      store-pailot-db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - store-pailot
      - otithee

  redis:
    image: redis:7-alpine
    container_name: store-pailot-ai-admin-redis
    restart: unless-stopped
    ports:
      # Host 6380 avoids conflict with other local Redis (default 6379)
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - store-pailot

  nginx:
    image: nginx:alpine
    container_name: store-pailot-ai-admin-nginx
    restart: unless-stopped
    ports:
      # Host 8188 avoids conflict with otithee (80, 9000–9021, 9090)
      - "${APP_PORT:-8188}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - store-pailot
      - otithee

  store-pailot-db:
    image: mysql:8.4
    container_name: store-pailot-ai-admin-mysql
    restart: unless-stopped
    ports:
      # Host 3316 avoids conflict with otithee MySQL on 3306
      - "${DB_HOST_PORT:-3316}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-store_pailot_ai_admin}
      MYSQL_USER: ${DB_USERNAME:-store}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ustore", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - store-pailot

volumes:
  mysql-data:

networks:
  store-pailot:
    driver: bridge
  otithee:
    name: otithee_integrated_local_otithee_network
    external: true
