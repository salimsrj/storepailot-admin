openapi: 3.1.0
info:
  title: CommercePilot API
  version: 1.0.0
  description: |
    Laravel backend for CommercePilot. The WordPress plugin authenticates with a
    site bearer token. Server-to-server routes also require HMAC headers.
servers:
  - url: /api/v1
security:
  - SiteToken: []
paths:
  /chat:
    post:
      summary: Send a customer chat message
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              conversation_id: 11111111-1111-1111-1111-111111111111
              visitor_id: 22222222-2222-2222-2222-222222222222
              message: Show me black running shoes
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '402':
          description: Monthly usage limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: usage_limit_reached
                  message: Your monthly message limit has been reached.
                  upgrade_required: true
                  upgrade_url: https://app.commercepilot.com/upgrade
        '429':
          description: Rate limit exceeded
  /chat/stream:
    post:
      summary: Stream a chat reply as Server-Sent Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: |
            SSE events: message.start, message.delta, tool.start, tool.end,
            message.complete, error
  /site:
    get:
      summary: Show the authenticated site
      responses:
        '200':
          description: Site profile
    patch:
      summary: Update site metadata
      responses:
        '200':
          description: Updated site
  /site/settings:
    patch:
      summary: Update assistant settings
      responses:
        '200':
          description: Updated settings
  /site/token/rotate:
    post:
      summary: Rotate the site token
      security:
        - SiteToken: []
          SiteHmac: []
      responses:
        '200':
          description: New plaintext token, shown once
  /usage:
    get:
      summary: Current period usage
      responses:
        '200':
          description: Usage snapshot
  /events:
    post:
      summary: Ingest a plugin analytics event
      security:
        - SiteToken: []
          SiteHmac: []
      responses:
        '202':
          description: Accepted
  /webhooks/billing:
    post:
      summary: Billing webhook
      security: []
      responses:
        '202':
          description: Accepted
        '401':
          description: Invalid webhook
  /sites:
    post:
      summary: Register a site for the authenticated account
      security:
        - UserSession: []
      responses:
        '201':
          description: Site created with one-time token
components:
  securitySchemes:
    SiteToken:
      type: http
      scheme: bearer
      description: Authorization Bearer cp_live_...
    SiteHmac:
      type: apiKey
      in: header
      name: X-CommercePilot-Signature
      description: HMAC-SHA256(timestamp + "." + body, site_secret)
    UserSession:
      type: apiKey
      in: cookie
      name: laravel_session
  schemas:
    ChatRequest:
      type: object
      required: [visitor_id, message]
      properties:
        conversation_id:
          type: string
          format: uuid
        visitor_id:
          type: string
          format: uuid
        message:
          type: string
          maxLength: 4000
    ChatResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            conversation_id:
              type: string
              format: uuid
            message:
              type: object
              properties:
                role:
                  type: string
                  example: assistant
                content:
                  type: string
            products:
              type: array
              items:
                type: object
            usage:
              type: object
              properties:
                used:
                  type: integer
                limit:
                  type: integer
                remaining:
                  type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
  headers:
    X-Request-ID:
      schema:
        type: string
      description: Correlation ID echoed on every response
    Retry-After:
      schema:
        type: integer
      description: Seconds until a 429 client may retry
